[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slack-student-expense-erp"
version = "0.1.0"
description = "Slack-native student expense pre-settlement and approval MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11,<4",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "slack-bolt>=1.22,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
