services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d expense_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://erp:local-development-only@db:5432/expense_erp
      AUTO_CREATE_SCHEMA: "false"
      SEED_CONFIGURATION: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

