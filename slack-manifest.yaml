display_information:
  name: Student Expense Support ERP
  description: Student expense pre-settlement and approval
  background_color: "#2f4f4f"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Expense Support ERP
    always_online: false
  slash_commands:
    - command: /expense
      url: https://example.com/slack/events
      description: Start a new expense request
      usage_hint: Open the expense request form
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - groups:read
      - users:read
settings:
  event_subscriptions:
    request_url: https://example.com/slack/events
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://example.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
